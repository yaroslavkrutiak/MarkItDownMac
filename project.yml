name: MarkItDownMac
options:
  bundleIdPrefix: com.markitdownmac
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  MarkItDownMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Bridge
      - path: Core
      - path: UI
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MarkItDownMac.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.markitdownmac.app
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: MarkItDownMac
        GENERATE_INFOPLIST_FILE: false

name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you trigger manually from the Actions tab

jobs:
  build:
    runs-on: macos-15      # comes with Xcode 16 pre-installed

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build
        run: |
          xcodebuild \
            -project MarkItDownMac.xcodeproj \
            -scheme MarkItDownMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          APP_PATH=$(find build -name "MarkItDownMac.app" -type d | head -1)
          ditto -c -k --keepParent "$APP_PATH" MarkItDownMac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownMac
          path: MarkItDownMac.zip

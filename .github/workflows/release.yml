name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build
        run: |
          xcodebuild \
            -project MarkItDownMac.xcodeproj \
            -scheme MarkItDownMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          APP_PATH=$(find build -name "MarkItDownMac.app" -type d | head -1)
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent MarkItDownMac.app "$GITHUB_WORKSPACE/MarkItDownMac.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: MarkItDownMac ${{ github.event.inputs.version }}
          files: MarkItDownMac.zip
          body: |
            ## Install

            1. Download **MarkItDownMac.zip** below
            2. Extract it
            3. Run in Terminal: `xattr -cr MarkItDownMac.app`
            4. Double-click **MarkItDownMac.app** to launch

            > The `xattr` step is needed because the app is not code-signed. macOS quarantines unsigned downloaded apps.

name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build
        run: |
          xcodebuild \
            -project MarkItDownMac.xcodeproj \
            -scheme MarkItDownMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Stage .app for upload
        run: |
          APP_PATH=$(find build -name "MarkItDownMac.app" -type d | head -1)
          mkdir -p artifact
          cp -R "$APP_PATH" artifact/MarkItDownMac.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownMac
          path: artifact/MarkItDownMac.app
